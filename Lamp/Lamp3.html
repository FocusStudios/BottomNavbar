<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="Gentle-Lamp.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;
user-select:none;}

body {
margin:0;
overflow:hidden;
display:flex;
justify-content:center;
background:var(--secondary);}

* {
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Istok Web", serif;
font-weight:300;
font-style:normal;}

:root {
--primary:#fff;
--secondary:#666;
--background:#000;}

.slide {
position:absolute;
top:500px;
width:90vw;
height:70vh;
display:flex;
justify-content:center;
align-items:center;
opacity:20%;
border-radius:20px;
background:var(--primary);
box-shadow:1px 4.5px 12px rgba(0,0,0,0.3)}

.content {
position:absolute;
width:100%;
height:2000px;
display:flex;
justify-content:center;}

.frame {
position:fixed;
bottom:0;
width:100vw;
height:100vh;
display:none;
justify-content:center;
overflow-x:hidden;
overflow-y:auto;
transition:0.3s ease-out;}

.frame.active {
display:flex;}

nav {
position:fixed;
bottom:0;
width:100vw;
height:70px;
display:flex;
align-items:center;
justify-content:center;
background:var(--background);
border-radius:8px 8px 0 0;
box-shadow:0 -8px 15px rgba(0,0,0,0.2);}

nav .icons {
position:absolute;
height:50px;
display:flex;
transition:0.3s;}

nav .icon {
width:50px;
height:50px;
z-index:1;
display:flex;
justify-content:center;
transition:0.6s;
cursor:pointer;
pointer-events:auto;}

nav .icon.active {
pointer-events:none;}

nav .icon svg {
transform:scale(0.8);}

nav .lamp {
position:absolute;
top:0;
width:45px;
height:6px;
border-radius:3px;
display:flex;
justify-content:center;
background:var(--primary);}

nav .light {
height:60px;
width:60px;
opacity:0.25;
clip-path:path('M12 0.101562H48L60 60.1016H0L12 0.101562Z');
background:linear-gradient(to bottom, var(--primary), transparent);}

nav .path {
transition:0.6s;
fill:var(--secondary);}

nav .icon.active .path {
fill:var(--primary);}

nav .indicator {
position:absolute;
top:-10px;
left:0;
width:60px;
height:60px;
display:flex;
justify-content:center;
transform:translateX(-5px);
--i1:0px;
--i2:calc(50px + (var(--const) - 150px)/2);
--i3:calc(100px + (var(--const) - 150px));}

@media screen and (max-width:600px) {

nav .indicator {
--const:90vw;}

nav .icons {
width:90vw;
column-gap:calc((90vw - 150px)/2);}

}

@media screen and (min-width:600px) and (max-width:1000px) {

nav .indicator {
--const:70vw;}

nav .icons {
width:70vw;
column-gap:calc((70vw - 150px)/2);}

}

@media screen and (min-width:1000px) {

nav .indicator {
--const:60vw;}

nav .icons {
width:60vw;
column-gap:calc((60vw - 150px)/2);}

}

</style>
</head>
<body>

<!-- Pages -->

<section class="frame active">
<div class="content">
<div class="slide"><h1>Home</h1></div>
</div>
</section>

<section class="frame">
<div class="content">
<div class="slide"><h1>Follow</h1></div>
</div>
</section>

<section class="frame">
<div class="content">
<div class="slide"><h1>Add</h1></div>
</div>
</section>

<!-- Bottom Navbar -->

<nav class="navbar">

<ul class="icons">

<li class="icon active">
<svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
<path class="path" d="M23.0713 12.6421C24.2244 11.7859 25.7931 11.786 26.9463 12.6421L35.6797 19.1265H35.6787C36.5246 19.7546 37.0184 20.7512 37.0186 21.8032V34.6577C37.0186 36.4708 35.5706 37.9761 33.7412 37.9761H16.2764C14.447 37.976 13 36.4708 13 34.6577V21.8032C13.0001 20.7512 13.4929 19.7546 14.3389 19.1265L23.0713 12.6421ZM25.6348 14.4087C25.3072 14.1655 24.8814 14.1355 24.5293 14.3179L24.3828 14.4087L15.6504 20.8931C15.3716 21.1 15.1993 21.4371 15.1992 21.8032V34.6577C15.1992 35.2954 15.7013 35.7768 16.2764 35.7769H33.7412C34.3163 35.7769 34.8184 35.2954 34.8184 34.6577V21.8032C34.8182 21.4372 34.6468 21.1001 34.3682 20.8931H34.3672L25.6348 14.4087Z"/>
</svg>
</li>

<li class="icon">
<svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
<path class="path" d="M32.3545 12.5C33.5453 12.5002 34.5048 13.4674 34.5049 14.6533V35.3389C34.5049 37.1712 32.3557 38.1762 30.9551 36.9746L25.002 31.8672L19.0488 36.9746C17.6482 38.1764 15.5 37.1711 15.5 35.3389V14.6533C15.5 13.4676 16.4585 12.5003 17.6494 12.5H32.3545ZM17.6992 35.2334L23.6035 30.1689L23.7588 30.0479C24.5554 29.4814 25.6458 29.5219 26.4004 30.1689L32.3047 35.2334V14.6992H17.6992V35.2334Z"/>
</svg>
</li>

<li class="icon">
<svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
<path class="path" fill-rule="evenodd" clip-rule="evenodd" d="M25 14.1832C19.0261 14.1832 14.1832 19.0261 14.1832 25C14.1832 30.9739 19.0261 35.8168 25 35.8168C30.9739 35.8168 35.8168 30.9739 35.8168 25C35.8168 19.0261 30.9739 14.1832 25 14.1832ZM12 25C12 17.8203 17.8203 12 25 12C32.1798 12 38 17.8203 38 25C38 32.1798 32.1798 38 25 38C17.8203 38 12 32.1798 12 25ZM24.0076 19.145C24.0076 18.5422 24.4964 18.0534 25.0992 18.0534C25.7022 18.0534 26.1908 18.5422 26.1908 19.145V24.0076H30.855C31.4579 24.0076 31.9466 24.4964 31.9466 25.0992C31.9466 25.7022 31.4579 26.1908 30.855 26.1908H26.1908V30.855C26.1908 31.4579 25.7022 31.9466 25.0992 31.9466C24.4964 31.9466 24.0076 31.4579 24.0076 30.855V26.1908H19.145C18.5422 26.1908 18.0534 25.7022 18.0534 25.0992C18.0534 24.4964 18.5422 24.0076 19.145 24.0076H24.0076V19.145Z"/>
</svg>
</li>

<section class="indicator">
<div class="light"></div>
<div class="lamp"></div>
</section>

</ul>

</nav>

<script>

const Icons = document.querySelectorAll(".icon");
const frames = document.querySelectorAll(".frame");
const Indicator = document.querySelector(".indicator");

let x = 1;

Icons.forEach((Icon,index) => {

Icon.addEventListener("click",() => {

document.querySelector(".icon.active").classList.remove("active");
Icon.classList.add("active");

document.querySelector(".frame.active").classList.remove("active");
frames[index].classList.add("active");

Indicator.style.animation = `Gentle${x}${index + 1} 1s forwards`;

x = index + 1;

});

});
 
</script>

</body>

</html>
