<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="Gentle-Lamp.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;
user-select:none;}

body {
margin:0;
overflow:hidden;
display:flex;
justify-content:center;
background:var(--secondary);}

* {
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Istok Web", serif;
font-weight:300;
font-style:normal;}

:root {
--primary:#fff;
--secondary:#666;
--background:#000;}

.slide {
position:absolute;
top:500px;
width:90vw;
height:70vh;
display:flex;
justify-content:center;
align-items:center;
opacity:20%;
border-radius:20px;
background:var(--primary);
box-shadow:1px 4.5px 12px rgba(0,0,0,0.3)}

.content {
position:absolute;
width:100%;
height:2000px;
display:flex;
justify-content:center;}

.frame {
position:fixed;
bottom:0;
width:100vw;
height:100vh;
display:none;
justify-content:center;
overflow-x:hidden;
overflow-y:auto;
transition:0.3s ease-out;}

.frame.active {
display:flex;}

nav {
position:fixed;
bottom:0;
width:100vw;
height:70px;
display:flex;
align-items:center;
justify-content:center;
background:var(--background);
border-radius:8px 8px 0 0;
box-shadow:0 -8px 15px rgba(0,0,0,0.2);}

nav .icons {
position:absolute;
height:50px;
display:flex;
transition:0.3s;}

nav .icon {
width:50px;
height:50px;
z-index:1;
display:flex;
justify-content:center;
transition:0.6s;
cursor:pointer;
pointer-events:auto;}

nav .icon.active {
pointer-events:none;}

nav .icon svg {
transform:scale(0.8);}

nav .lamp {
position:absolute;
top:0;
width:45px;
height:6px;
border-radius:3px;
display:flex;
justify-content:center;
background:var(--primary);}

nav .light {
height:60px;
width:60px;
opacity:0.25;
clip-path:path('M12 0.101562H48L60 60.1016H0L12 0.101562Z');
background:linear-gradient(to bottom, var(--primary), transparent);}

nav .path {
transition:0.6s;
fill:var(--secondary);}

nav .icon.active .path {
fill:var(--primary);}

nav .indicator {
position:absolute;
top:-10px;
left:0;
width:60px;
height:60px;
display:flex;
justify-content:center;
transform:translateX(-5px);
--i1:0px;
--i2:calc(50px + (var(--const) - 200px)/3);
--i3:calc(100px + 2*(var(--const) - 200px)/3);
--i4:calc(150px + (var(--const) - 200px));}

@media screen and (max-width:600px) {

nav .indicator {
--const:80vw;}

nav .icons {
width:80vw;
column-gap:calc((80vw - 200px)/3);}

}

@media screen and (min-width:600px) and (max-width:1000px) {

nav .indicator {
--const:70vw;}

nav .icons {
width:70vw;
column-gap:calc((70vw - 200px)/3);}

}

@media screen and (min-width:1000px) {

nav .indicator {
--const:60vw;}

nav .icons {
width:60vw;
column-gap:calc((60vw - 200px)/3);}

}

</style>
</head>
