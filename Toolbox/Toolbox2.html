<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;
user-select:none;}

body {
margin:0;
width:100vw;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
background:var(--background);}

* {
margin:0;
padding:0;
box-sizing:border-box;
font-weight:300;
font-style:normal;
font-family:"Istok Web", serif;}

:root {
--primary:#820767;
--secondary:#FFDDF3;
--background:#fff;
--shadow:rgba(130,7,103,0.3);
--layer:rgba(130,7,103,0.15);}

.Header {
position:sticky;
top:0;
width:100%;
height:55px;}

.back {
position:absolute;
top:10px;
left:10px;
border-radius:9px;
cursor:pointer;
stroke:var(--background);
background:rgba(255,255,255,0.2);
box-shadow:1px 4.5px 12px rgba(0,0,0,0.1);}

.slide {
position:absolute;
top:500px;
width:80vw;
height:70vh;
display:flex;
justify-content:center;
align-items:center;
opacity:20%;
border-radius:20px;
background:var(--background);
box-shadow:1px 4.5px 12px rgba(0,0,0,0.5);}

.content {
position:absolute;
width:100%;
height:2000px;
display:flex;
justify-content:center;} 

.frame, .Frame {
position:fixed;
bottom:0;
width:100%;
height:100%;
overflow-x:hidden;
overflow-y:auto;
display:none;
justify-content:center;}

.frame.active {
display:flex;}

.Frame {
left:100%;
z-index:2;
display:flex;
transition:0.3s;
background:var(--primary);}

.Frame.active {
left:0;}

.toolbox {
position:fixed;
left:20px;
bottom:20px;
width:70px;
height:70px;
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
background:var(--secondary);
transition:0.7s cubic-bezier(0,0,0,1);
box-shadow:-3px 3px 8px var(--shadow);}

.icon {
position:absolute;
bottom:15px;
width:40px;
height:40px;
border-radius:10px;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
transition:all 0.3s, transform 0.7s cubic-bezier(0,0,0,1);}

.icon.A {
opacity:0;}

.icon.A svg {
fill:var(--primary);}

.toolbox.active {
height:290px;}

.toolbox.active .icon.A {
opacity:1;}

.toolbox .icon.plus {
z-index:1;
background:var(--primary);}

.Plus {
transition:0.5s;
fill:var(--secondary);}

.icon.A.active {
background:var(--layer);}

.toolbox.active .Plus {
transform:rotate(135deg);}

.toolbox.active .icon.A:nth-child(2) {
transform:translateY(-55px);}

.toolbox.active .icon.A:nth-child(3) {
transform:translateY(-110px);}

.toolbox.active .icon.A:nth-child(4) {
transform:translateY(-165px);}

.toolbox.active .icon.A:nth-child(5) {
transform:translateY(-220px);}

</style>

</div>

<script>

const Toolbox = document.querySelector(".toolbox");
const Add = document.querySelector(".plus");
const Icons = document.querySelectorAll(".icon.A");
const frames = document.querySelectorAll(".frame");
const Frames = document.querySelectorAll(".Frame");
const Backs = document.querySelectorAll(".back");

// Click On Add-Btn
Add.addEventListener("click", () => {

if(Toolbox.classList.contains("active")){

Toolbox.classList.remove("active");

}else{

Toolbox.classList.add("active");

}

});

// Click on Icons
Icons.forEach((Icon,index) => {

Icon.addEventListener("click", () => {

Icons.forEach(Icon => Icon.classList.remove("active"));
Icons[index].classList.add("active");

frames.forEach(frame => frame.classList.remove("active"));
frames[index].classList.add("active");

setTimeout(() => {
Frames[index].classList.add("active");},300);

setTimeout(() => {
Toolbox.classList.remove("active");
Icons.forEach(Icon => {Icon.classList.remove("active");});
},500);

});

});


//Click on Back
Backs.forEach(Back => {

Back.addEventListener("click",() => {

document.querySelector(".Frame.active").classList.remove("active");

});

});


</script>
